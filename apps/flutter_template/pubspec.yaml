name: flutter_template
resolution: workspace
description: "flutter_template"
version: 1.0.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  path_provider: ^2.1.5
  path: ^1.9.0
  csv: ^6.0.0
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  flex_color_scheme: ^8.2.0
  objectbox: ^4.3.0
  objectbox_flutter_libs: any
  injectable: ^2.5.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  objectbox_generator: any
  injectable_generator: ^2.7.0
  fastforge: ^0.0.1
  build_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/locales/






